$kind: http-request
description: ""
url: "{{base_url}}/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\" : \"owner@test.com\",\r

    \    \"password\" : \"Password123!\"\r

    }"
scripts:
  - type: beforeRequest
    code: pm.environment.set("who_login", "owner");
    language: text/javascript
  - type: afterResponse
    code: "if (pm.response.code === 200) {\r

      \    const data = pm.response.json();\r

      \    const role = pm.environment.get(\"who_login\");\r

      \    pm.environment.set(\"token_\" + role, data.token);\r

      }"
    language: text/javascript
