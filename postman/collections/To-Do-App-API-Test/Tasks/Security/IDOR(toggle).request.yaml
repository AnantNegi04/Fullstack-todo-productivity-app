$kind: http-request
name: IDOR(toggle)
description: ""
url: "{{base_url}}/tasks/{{task_id}}/toggle"
method: PUT
auth:
  type: bearer
  credentials:
    token: "{{token_attacker}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Attacker receives 404, not false success\", function () {\r

      \    pm.expect(pm.response.code).to.equal(404);\r

      });\r

      \r

      \    const baseUrl = pm.environment.get(\"base_url\");\r

      \    const taskId = pm.environment.get(\"task_id\");\r

      \    const token = pm.environment.get(\"token_owner\");\r

      \    const taskStatus = pm.environment.get(\"task_status\");\r

      \r

      \    const requestOptions = {\r

      \        method: 'GET',\r

      \        url : `${baseUrl}/tasks`,\r

      \        header : {\r

      \            Authorization : `Bearer ${token}`\r

      \        }\r

      \    }\r

      \r

      \    console.log(taskStatus);\r

      \r

      \    pm.sendRequest(requestOptions, function (err, response) {\r

      \        if (err) {\r

      \            console.error(\"Inner GET failed to complete:\", err);\r

      \            pm.test(\"Task should not be toggled by attacker\", function() {\r

      \                pm.expect.fail(\"Verification request errored\" + err);\r

      \            });\r

      \            return;\r

      \        }\r

      \        const taskStored = pm.environment.get(\"task_status\");\r

      \        const taskData = response.json();\r

      \        \r

      \        const responseTask = taskData.find(task => task.id == taskId);\r

      \r

      \        pm.test(\"Task should not be toggled by attacker\", () => {\r

      \            pm.expect(taskStored).to.equal(responseTask.completed);\r

      \        });\r

      \    });\r\n"
    language: text/javascript
  - type: beforeRequest
    code: "const taskId = pm.environment.get(\"task_id\");\r

      const requestOptions = {\r

      \    method: 'GET',\r

      \    url: pm.environment.get(\"base_url\") + \"/tasks\",\r

      \    header : {\r

      \        Authorization: \"Bearer \" + pm.environment.get(\"token_owner\")\r

      \    }\r

      };\r

      \r

      pm.sendRequest(requestOptions, function(err, response) {\r

      \    if (err) {\r

      \        console.error(\"error encountered while fetching task\", err.message);\r

      \        return;\r

      \    }\r

      \    const res = response.json();\r

      \    const taskData = res.find(task => task.id == taskId);\r

      \    console.log(taskData.completed);\r

      \    pm.environment.set(\"task_status\", taskData.completed);\r

      });"
    language: text/javascript
order: 4492660345342092
